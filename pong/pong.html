<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong - Arcade</title>
    <link rel="stylesheet" href="stylePong.css">
</head>
<body>
    <div class="game-container">
        <h1>🏓 Jogo de Pong</h1>
         <a href="../index.html" class="btn-retornar">Retornar</a>
        
        <!-- Placar do Jogo com as cores dos jogadores -->
        <div class="score-board">
            <span style="color: #64B5F6;">Jogador 1: <span id="playerScore">0</span></span> 
            | 
            <span style="color: #FF5252;">Jogador 2: <span id="aiScore">0</span></span>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="600" height="400"></canvas>
            
            <!-- Tela Inicial -->
            <div id="startScreen" class="overlay-screen">
                <h2>PRONTO PARA JOGAR?</h2>
                <p>Jogador 1 (W/S) | Jogador 2 (Setas CIMA/BAIXO)</p>
                <button class="btn" id="startBtn">INICIAR JOGO</button>
            </div>

            <!-- Tela de Game Over -->
            <div id="gameOverScreen" class="overlay-screen hidden">
                <h2>FIM DE JOGO!</h2>
                <p id="winnerText">O computador venceu!</p>
                <button class="btn" id="restartBtn">JOGAR NOVAMENTE</button>
            </div>
        </div>

        <div class="instructions">Faça 5 pontos para vencer!</div>
    </div>
    
    <script src="scriptPong.js"></script>
</body>
</html>
