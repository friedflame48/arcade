<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
  /* ── Flame Cursor: hide system cursor on desktop only ── */
  @media (hover: hover) and (pointer: fine) {
    *, *::before, *::after { cursor: none !important; }
  }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0D0D0F;
      --surface: #141418;
      --surface2:#1C1C22;
      --border:  rgba(255,255,255,0.07);
      --accent:  #FF4500;
      --accent2: #C8873A;
      --smoke:   #2A2A30;
      --text:    #F0EDE8;
      --muted:   rgba(240,237,232,0.5);
      --display: 'Bebas Neue', sans-serif;
      --body:    'DM Sans', sans-serif;
      --mono:    'JetBrains Mono', monospace;
      --glow:    0 0 40px rgba(255,69,0,0.35);
      --glow-sm: 0 0 16px rgba(255,69,0,0.25);
      --radius:  4px;
      --nav-h:   64px;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; overflow-x: hidden; }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03; pointer-events: none; z-index: 9999;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

    /* ── NAV ── */
    #nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
      z-index: 200; display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(1.5rem, 5vw, 4rem);
      background: linear-gradient(to bottom, rgba(13,13,15,0.95), rgba(13,13,15,0));
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background 0.3s;
    }
    #nav.scrolled { background: rgba(13,13,15,0.97); }
    .nav-logo { font-family: var(--display); font-size: 1.6rem; letter-spacing: 0.08em; color: var(--text); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-burger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
    .nav-burger span { display: block; width: 22px; height: 1.5px; background: var(--text); transition: transform 0.25s, opacity 0.25s; }
    .nav-burger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-burger.open span:nth-child(2) { opacity: 0; }
    .nav-burger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
    .nav-drawer { display: none; position: fixed; top: var(--nav-h); left: 0; right: 0; background: rgba(13,13,15,0.98); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 2rem clamp(1.5rem,5vw,4rem); border-bottom: 1px solid var(--border); z-index: 190; flex-direction: column; gap: 1.5rem; }
    .nav-drawer a { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
    .nav-drawer a:hover { color: var(--accent); }

    /* ── HERO ── */
    #hero { position: relative; min-height: 100vh; display: flex; align-items: flex-end; padding: calc(var(--nav-h) + 2rem) clamp(1.5rem, 5vw, 4rem) clamp(4rem, 8vh, 7rem); overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.3) saturate(0.7); }
    .hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(13,13,15,0.2) 0%, rgba(13,13,15,0) 35%, rgba(13,13,15,0.85) 75%, rgba(13,13,15,1) 100%); }
    #ember-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .hero-content { position: relative; z-index: 2; max-width: 900px; }
    .hero-eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
    .hero-eyebrow::before { content: ''; display: block; width: 2rem; height: 1px; background: var(--accent); flex-shrink: 0; }
    .hero-name { font-family: var(--display); font-size: clamp(5rem, 14vw, 11rem); line-height: 0.9; letter-spacing: 0.02em; color: var(--text); text-shadow: var(--glow); margin-bottom: 0.5em; }
    .hero-name-bar { display: block; width: 3.5rem; height: 3px; background: var(--accent); margin-top: 0.35em; box-shadow: var(--glow); }
    .hero-bio { font-size: clamp(0.9rem, 1.6vw, 1.05rem); color: rgba(240,237,232,0.65); max-width: 480px; margin-bottom: 2.5rem; line-height: 1.75; }
    .hero-cta { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 2rem; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.65rem 1.5rem; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; text-decoration: none; border-radius: var(--radius); transition: all 0.2s; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--glow-sm); }
    .btn-primary:hover { background: #ff5a1f; box-shadow: var(--glow); transform: translateY(-2px); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    .btn-ghost { background: transparent; color: var(--muted); border: none; padding: 0; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; transition: color 0.2s; cursor: pointer; }
    .btn-ghost:hover { color: var(--accent); }

    /* ── SOCIALS ── */
    .socials-strip { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .social-link { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.9rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-decoration: none; text-transform: uppercase; transition: all 0.2s; }
    .social-link svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
    .social-link:hover { color: var(--text); border-color: var(--accent); background: rgba(255,69,0,0.07); }

    /* ── SHARED SECTION ── */
    .section { padding: clamp(4rem, 9vh, 7rem) clamp(1.5rem, 5vw, 4rem); position: relative; }
    .section-inner { max-width: 1200px; margin: 0 auto; }
    .section-label { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.75rem; }
    .section-label::before { content: ''; display: block; width: 2rem; height: 1px; background: var(--accent); flex-shrink: 0; }
    .section-heading { font-family: var(--display); font-size: clamp(2.2rem, 5vw, 3.8rem); line-height: 1; letter-spacing: 0.02em; margin-bottom: 0.25em; }
    .section-sub { font-size: 0.9rem; color: var(--muted); letter-spacing: 0.06em; }
    .divider { border: none; border-top: 1px solid var(--border); }

    /* ── SECTION HEADER ROW (label + "view all" link) ── */
    .section-top {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 2.5rem; gap: 1rem; flex-wrap: wrap;
    }

    /* ── GALLERY PREVIEW ── */
    #gallery-preview { background: var(--surface); }
    .gallery-preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .preview-card {
      position: relative; overflow: hidden;
      clip-path: polygon(10px 0%, 100% 0%, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0% 100%, 0% 10px);
      background: var(--smoke); cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .preview-card:hover { transform: translateY(-4px); box-shadow: var(--glow); }
    .preview-card img { width: 100%; height: 220px; object-fit: cover; display: block; transition: transform 0.5s; }
    .preview-card:hover img { transform: scale(1.05); }
    .preview-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(13,13,15,0.8) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.3s;
      display: flex; align-items: flex-end; padding: 0.85rem;
    }
    .preview-card:hover .preview-card-overlay { opacity: 1; }
    .preview-card-title { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); }
    .preview-card.spoiler img { filter: blur(16px) brightness(0.35); }
    .preview-card.spoiler:hover img { filter: none; }

    /* ── COMMISSION PREVIEW ── */
    #commission-preview { background: var(--bg); }
    .comm-preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 280px;
    }
    .comm-preview-img {
      position: relative; overflow: hidden;
    }
    .comm-preview-img img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.55; display: block;
      transition: opacity 0.4s, transform 0.5s;
    }
    .comm-preview-card:hover .comm-preview-img img { opacity: 0.7; transform: scale(1.03); }
    .comm-preview-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 60%, var(--surface));
    }
    .comm-preview-body {
      padding: clamp(2rem, 4vw, 3rem);
      display: flex; flex-direction: column; justify-content: center; gap: 1.25rem;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.35rem 0.9rem; border-radius: 100px;
      width: fit-content;
    }
    .status-pill.open { background: rgba(62,207,142,0.12); border: 1px solid rgba(62,207,142,0.35); color: #3ecf8e; }
    .status-pill.closed { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); color: #ef4444; }
    .status-pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .comm-preview-note { font-size: 0.92rem; color: var(--muted); line-height: 1.7; }
    .comm-price-glimpse {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
    }
    .price-chip {
      font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em;
      padding: 0.3rem 0.75rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--muted);
    }
    .price-chip strong { color: var(--accent); }

    /* ── OC PREVIEW ── */
    #oc-preview { background: var(--surface); }
    .oc-preview-grid {
      display: grid; grid-template-columns: 1fr 1.2fr;
      gap: 4rem; align-items: center;
    }
    .oc-preview-frame {
      position: relative; overflow: hidden;
      clip-path: polygon(16px 0%, 100% 0%, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0% 100%, 0% 16px);
      background: var(--smoke);
    }
    .oc-preview-frame img { width: 100%; height: 380px; object-fit: cover; display: block; opacity: 0.9; transition: opacity 0.3s, transform 0.6s; }
    .oc-preview-frame:hover img { opacity: 1; transform: scale(1.03); }
    .oc-preview-frame::before { content: ''; position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); box-shadow: var(--glow-sm); z-index: 1; pointer-events: none; }
    .oc-preview-frame::after  { content: ''; position: absolute; bottom: 0; right: 0; width: 44px; height: 44px; border-bottom: 2px solid var(--accent2); border-right: 2px solid var(--accent2); z-index: 1; pointer-events: none; }
    .oc-badge { display: inline-block; background: var(--accent); color: #fff; font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.35rem 0.8rem; border-radius: var(--radius); box-shadow: var(--glow-sm); margin-bottom: 1.25rem; }
    .oc-preview-body { font-size: 1rem; color: var(--muted); line-height: 1.8; margin-bottom: 1.75rem; }

    /* ── FOOTER ── */
    #footer { padding: 2rem clamp(1.5rem, 5vw, 4rem); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .footer-copy { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
    .footer-credit a { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em; color: var(--muted); text-decoration: none; text-transform: uppercase; transition: color 0.2s; }
    .footer-credit a:hover { color: var(--accent); }

    /* ── FADE ── */
    .fade-up { opacity: 0; transform: translateY(24px); transition: opacity 0.65s, transform 0.65s; }
    .fade-up.visible { opacity: 1; transform: none; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .gallery-preview-grid { grid-template-columns: repeat(2, 1fr); }
      .gallery-preview-grid .preview-card:nth-child(3) { display: none; }
      .comm-preview-card { grid-template-columns: 1fr; }
      .comm-preview-img { display: none; }
      .oc-preview-grid { grid-template-columns: 1fr; gap: 2.5rem; }
      .oc-preview-frame img { height: 260px; }
    }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .nav-burger { display: flex; }
      .gallery-preview-grid { grid-template-columns: 1fr; }
      .gallery-preview-grid .preview-card:nth-child(3) { display: block; }
      .preview-card img { height: 180px; }
      /* Hero adjustments */
      .hero-cta { flex-direction: column; align-items: flex-start; }
      .hero-cta .btn { width: 100%; justify-content: center; min-height: 48px; }
      .socials-strip { gap: 0.4rem; }
      .social-link { min-height: 44px; }
      /* Commission preview */
      .comm-preview-body { padding: 1.5rem; }
      /* OC preview stacks already via 900px breakpoint */
    }
    /* Extra small */
    @media (max-width: 380px) {
      .hero-name { font-size: clamp(3.8rem, 18vw, 5rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-up { transition: none; opacity: 1; transform: none; }
      #ember-canvas { display: none; }
    }
  </style>
</head>

    let W, H, particles = [];
    function resize() { W = canvas.width = canvas.offsetWidth; H = canvas.height = canvas.offsetHeight; }
    window.addEventListener('resize', resize, { passive: true });
    resize();
    class Ember {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * W; this.y = H + 10;
        this.vx = (Math.random() - 0.5) * 0.8; this.vy = -(Math.random() * 1.5 + 0.4);
        this.life = 0; this.maxLife = Math.random() * 200 + 120;
        this.r = Math.random() * 2 + 0.4; this.hue = Math.random() * 30 + 5;
      }
      update() {
        this.x += this.vx + Math.sin(this.life * 0.05) * 0.3; this.y += this.vy; this.life++;
        if (this.life > this.maxLife || this.y < -10) this.reset();
      }
      draw() {
        const alpha = Math.sin((this.life / this.maxLife) * Math.PI) * 0.75;
        ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${this.hue}, 100%, 62%)`;
        ctx.shadowBlur = 6; ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
        ctx.fill(); ctx.restore();
      }
    }
    for (let i = 0; i < 80; i++) { const p = new Ember(); p.life = Math.random() * p.maxLife; particles.push(p); }
    function loop() { ctx.clearRect(0, 0, W, H); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(loop); }
    loop();
  }
})();

  <!-- ── Vector Flame Cursor ── -->
  <script>
// ── VECTOR FLAME CURSOR ENGINE ─────────────────────────────────
    (function () {
      // Skip flame cursor on touch-primary devices (mobile/tablet)
      if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const canvas = document.createElement('canvas');
      canvas.id = 'flame-cursor-canvas';
      canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9998;';
      document.body.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let width  = canvas.width  = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const particles    = [];
      const embers       = [];
      const shockwaves   = [];
      const trailHistory = [];

      const mouse = {
        x: width / 2, y: height / 2,
        prevX: width / 2, prevY: height / 2,
        speed: 0,
        lastMoveTime: performance.now()
      };

      const SPEED_FAST = 20;
      function speedT(speed) { return Math.min(speed / SPEED_FAST, 1); }

      // Palette
      const COLOR_OUTER = '#FF0055'; 
      const COLOR_MID   = '#FF6D00'; 
      const COLOR_INNER = '#FFD600'; 
      const COLOR_CORE  = '#FFFFFF'; 

      // Helper: Draw a sharp 2D vector flame droplet shape
      function drawVectorFlameShape(ctx, width, height) {
        ctx.beginPath();
        ctx.moveTo(0, -height);
        ctx.bezierCurveTo(width * 0.8, -height * 0.3, width, height * 0.5, 0, height);
        ctx.bezierCurveTo(-width, height * 0.5, -width * 0.8, -height * 0.3, 0, -height);
        ctx.closePath();
        ctx.fill();
      }

      // ── Vector Flame Particle ──
      class FlameParticle {
        constructor(x, y, speed, isIdle = false, isBurst = false) { this.reset(x, y, speed, isIdle, isBurst); }
        reset(x, y, speed, isIdle, isBurst) {
          this.isIdle = isIdle;
          this.isBurst = isBurst;
          const t = speedT(speed);

          if (isIdle) {
            this.x = x + (Math.random() - 0.5) * 8;
            this.y = y + Math.random() * 4;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = -(Math.random() * 0.8 + 0.6);
            this.w = Math.random() * 5 + 3;
            this.h = this.w * (Math.random() * 0.6 + 1.2);
            this.shrinkRate = 0.93;
          } else if (isBurst) {
            // High distance blast trajectory for click explosions
            this.x = x;
            this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const force = Math.random() * 12 + 6; // Travel further distance
            this.vx = Math.cos(angle) * force;
            this.vy = Math.sin(angle) * force;
            this.w = Math.random() * 10 + 8;
            this.h = this.w * (Math.random() * 0.8 + 1.4);
            this.shrinkRate = Math.random() * 0.04 + 0.93; // Smooth size reduction to zero
          } else {
            this.x = x + (Math.random() - 0.5) * 6;
            this.y = y + (Math.random() - 0.5) * 6;
            const spread = 0.3 + t * 0.7;
            const upDrift = 1.0 + t * 1.5;
            this.vx = (Math.random() - 0.5) * spread * 2;
            this.vy = -upDrift;
            this.w = Math.random() * (6 + t * 8) + 4;
            this.h = this.w * (Math.random() * 0.8 + 1.4);
            this.shrinkRate = 0.92;
          }

          this.initialW = this.w;
          this.angle = Math.atan2(this.vy, this.vx) + Math.PI / 2 + (Math.random() - 0.5) * 0.3;
          this.rotSpeed = (Math.random() - 0.5) * 0.12;
        }

        update() {
          this.x += this.vx; 
          this.y += this.vy;
          
          if (this.isIdle) {
            this.vx += (Math.random() - 0.5) * 0.05;
          } else if (this.isBurst) {
            this.vx *= 0.94; // Air friction for travel distance momentum
            this.vy *= 0.94;
          }

          this.w *= this.shrinkRate;
          this.h *= this.shrinkRate;
          this.angle += this.rotSpeed;
        }

        draw() {
          if (this.w < 0.2) return;
          const progress = 1 - (this.w / this.initialW); 

          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);

          const outerColor = progress > 0.4 ? COLOR_OUTER : COLOR_MID;
          ctx.fillStyle = outerColor;
          ctx.shadowColor = outerColor;
          ctx.shadowBlur = 10;

          drawVectorFlameShape(ctx, this.w, this.h);

          if (progress < 0.75 && this.w > 2) {
            ctx.fillStyle = COLOR_INNER;
            ctx.shadowColor = COLOR_INNER;
            ctx.shadowBlur = 6;
            drawVectorFlameShape(ctx, this.w * 0.6, this.h * 0.65);
          }

          if (progress < 0.35 && this.w > 3) {
            ctx.fillStyle = COLOR_CORE;
            ctx.shadowColor = COLOR_CORE;
            ctx.shadowBlur = 4;
            drawVectorFlameShape(ctx, this.w * 0.3, this.h * 0.35);
          }

          ctx.restore();
        }

        // Particle dies strictly when size shrinks to zero
        get dead() { return this.w < 0.2; }
      }

      // ── Angular Vector Shard / Spark ──
      class EmberParticle {
        constructor(x, y, speed, isIdle = false, isBurst = false) {
          this.x = x; this.y = y;
          const t = speedT(speed);
          
          if (isIdle) {
            this.vx = (Math.random() - 0.5) * 1.2;
            this.vy = -(Math.random() * 1.5 + 1.0);
            this.size = Math.random() * 2 + 2;
            this.shrinkRate = 0.94;
          } else if (isBurst) {
            const angle = Math.random() * Math.PI * 2;
            const force = Math.random() * 14 + 8; // High speed outward burst
            this.vx = Math.cos(angle) * force;
            this.vy = Math.sin(angle) * force;
            this.size = Math.random() * 6 + 4;
            this.shrinkRate = Math.random() * 0.03 + 0.92;
          } else {
            const angle = Math.random() * Math.PI * 2;
            const force = Math.random() * (4 + t * 6) + 2;
            this.vx = Math.cos(angle) * force;
            this.vy = Math.sin(angle) * force - 1;
            this.size = Math.random() * (4 + t * 3) + 3;
            this.shrinkRate = 0.93;
          }

          const colors = [COLOR_INNER, COLOR_MID, COLOR_OUTER, COLOR_CORE];
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.4;
        }

        update() {
          this.x += this.vx; this.y += this.vy;
          this.vx *= 0.94; this.vy *= 0.94;
          this.size *= this.shrinkRate; // Shrink until zero
          this.rotation += this.rotSpeed;
        }

        draw() {
          if (this.size < 0.2) return;
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 6;

          ctx.beginPath();
          ctx.moveTo(0, -this.size * 1.2);
          ctx.lineTo(this.size * 0.6, this.size * 0.8);
          ctx.lineTo(-this.size * 0.8, this.size * 0.4);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }

        // Ember dies when size collapses to zero
        get dead() { return this.size < 0.2; }
      }

      // ── Polygon Shockwave with Random Rotation ──
      class Shockwave {
        constructor(x, y) {
          this.x = x; this.y = y;
          this.radius = 6;
          this.maxRadius = 80;
          this.life = 1;
          this.sides = 6; // Hexagon
          this.rotationAngle = Math.random() * Math.PI * 2; // Random rotation every click
        }

        update() {
          this.radius += (this.maxRadius - this.radius) * 0.22;
          this.life -= 0.07;
        }

        draw() {
          if (this.life <= 0) return;
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = Math.max(2, 6 * this.life);
          ctx.strokeStyle = COLOR_INNER;
          ctx.shadowColor = COLOR_INNER;
          ctx.shadowBlur = 12;
          
          ctx.beginPath();
          for (let i = 0; i < this.sides; i++) {
            const a = (i / this.sides) * Math.PI * 2 + this.rotationAngle;
            const px = this.x + Math.cos(a) * this.radius;
            const py = this.y + Math.sin(a) * this.radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }

        get dead() { return this.life <= 0; }
      }

      // ── Layered Solid Vector Ribbon Trail ──
      function drawSlashRibbon() {
        if (trailHistory.length < 3) return;
        
        const passes = [
          { color: COLOR_MID, widthFactor: 1.0, glow: 10 },
          { color: COLOR_INNER, widthFactor: 0.5, glow: 6 },
          { color: COLOR_CORE, widthFactor: 0.2, glow: 3 }
        ];

        passes.forEach(pass => {
          ctx.save();
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = pass.color;
          ctx.shadowColor = pass.color;
          ctx.shadowBlur = pass.glow;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          for (let i = 1; i < trailHistory.length - 1; i++) {
            const xc = (trailHistory[i].x + trailHistory[i + 1].x) / 2;
            const yc = (trailHistory[i].y + trailHistory[i + 1].y) / 2;
            const frac = i / trailHistory.length;
            
            ctx.beginPath();
            ctx.moveTo(trailHistory[i - 1].x, trailHistory[i - 1].y);
            ctx.quadraticCurveTo(trailHistory[i].x, trailHistory[i].y, xc, yc);
            ctx.lineWidth = frac * 14 * pass.widthFactor;
            ctx.stroke();
          }
          ctx.restore();
        });
      }

      // ── Glowing Cursor Reticle ──
      function drawCursorCore() {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        
        ctx.shadowColor = COLOR_MID;
        ctx.shadowBlur = 12;

        ctx.fillStyle = COLOR_MID;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLOR_INNER;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COLOR_CORE;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // ── Input Handling ──
      function updateMousePos(x, y) {
        mouse.prevX = mouse.x; mouse.prevY = mouse.y;
        mouse.x = x; mouse.y = y;
        const dx = mouse.x - mouse.prevX, dy = mouse.y - mouse.prevY;
        mouse.speed = Math.sqrt(dx * dx + dy * dy);
        mouse.lastMoveTime = performance.now();

        trailHistory.push({ x: mouse.x, y: mouse.y });
        if (trailHistory.length > 8) trailHistory.shift();

        const flameCount = Math.min(Math.floor(mouse.speed * 0.25) + 1, 4);
        for (let i = 0; i < flameCount; i++) {
          particles.push(new FlameParticle(mouse.x, mouse.y, mouse.speed));
        }

        if (mouse.speed > 5) {
          const ec = Math.min(Math.floor(mouse.speed * 0.2), 3);
          for (let i = 0; i < ec; i++) {
            embers.push(new EmberParticle(mouse.x, mouse.y, mouse.speed));
          }
        }
      }

      window.addEventListener('mousemove', e => updateMousePos(e.clientX, e.clientY));
      window.addEventListener('touchmove', e => {
        if (e.touches.length > 0) updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      // Click Event: High distance burst + Randomly rotated hexagon ring
      window.addEventListener('click', e => {
        shockwaves.push(new Shockwave(e.clientX, e.clientY));
        
        for (let i = 0; i < 14; i++) {
          particles.push(new FlameParticle(e.clientX, e.clientY, 0, false, true));
        }
        for (let i = 0; i < 16; i++) {
          embers.push(new EmberParticle(e.clientX, e.clientY, 0, false, true));
        }
      });

      window.addEventListener('resize', () => {
        width  = canvas.width  = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // ── Main Loop ──
      function animate() {
        ctx.clearRect(0, 0, width, height);

        if (mouse.speed < 1) {
          if (trailHistory.length > 0) {
            trailHistory.shift(); 
          }

          for (let i = 0; i < particles.length; i++) {
            if (!particles[i].isIdle && !particles[i].isBurst) {
              const dx = particles[i].x - mouse.x;
              const dy = particles[i].y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist > 15) {
                particles[i].w *= 0.85; // Faster decay for tail particles at rest
              }
            }
          }

          if (Math.random() < 0.4) {
            particles.push(new FlameParticle(mouse.x, mouse.y, 0, true));
          }
          if (Math.random() < 0.15) {
            embers.push(new EmberParticle(mouse.x, mouse.y, 0, true));
          }
        }

        mouse.speed *= 0.88;

        drawSlashRibbon();

        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update(); particles[i].draw();
          if (particles[i].dead) particles.splice(i, 1);
        }
        for (let i = embers.length - 1; i >= 0; i--) {
          embers[i].update(); embers[i].draw();
          if (embers[i].dead) embers.splice(i, 1);
        }
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          shockwaves[i].update(); shockwaves[i].draw();
          if (shockwaves[i].dead) shockwaves.splice(i, 1);
        }

        drawCursorCore();
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
