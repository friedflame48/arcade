<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @media (hover: hover) and (pointer: fine) { *, *::before, *::after { cursor: none !important; } }

    :root {
      --bg:       #0D0D0F;
      --surface:  #141418;
      --surface2: #1C1C22;
      --surface3: #23232C;
      --border:   rgba(255,255,255,0.07);
      --accent:   #FF4500;
      --accent2:  #C8873A;
      --text:     #F0EDE8;
      --muted:    rgba(240,237,232,0.48);
      --display:  'Bebas Neue', sans-serif;
      --body:     'DM Sans', sans-serif;
      --mono:     'JetBrains Mono', monospace;
      --glow:     0 0 40px rgba(255,69,0,0.35);
      --glow-sm:  0 0 16px rgba(255,69,0,0.22);
      --radius:   4px;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* noise grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 9999;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

    /* ── LAYOUT ── */
    .sheet {
      max-width: 960px;
      margin: 0 auto;
      padding: clamp(2.5rem, 6vw, 4.5rem) clamp(1.25rem, 4vw, 3rem);
    }

    /* ── HEADER ── */
    .sheet-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .header-left {}
    .header-eyebrow {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }
    .header-eyebrow::before {
      content: '';
      display: block;
      width: 1.75rem;
      height: 1px;
      background: var(--accent);
      flex-shrink: 0;
    }
    .sheet-name {
      font-family: var(--display);
      font-size: clamp(2.8rem, 7vw, 5rem);
      line-height: 0.9;
      letter-spacing: 0.02em;
      text-shadow: var(--glow);
    }
    .sheet-alias {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-top: 0.5rem;
    }
    .header-right {
      text-align: right;
    }
    .version-block {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: flex-end;
    }
    .version-block .ver-row { display: flex; align-items: center; gap: 6px; }
    .ver-label { color: var(--muted); text-transform: uppercase; }
    .ver-num { color: var(--text); }
    .ver-num--gold { color: var(--accent2); }
    .ver-note {
      font-size: 0.58rem;
      background: rgba(200,135,58,0.15);
      border: 1px solid rgba(200,135,58,0.3);
      color: var(--accent2);
      padding: 1px 6px;
      border-radius: 3px;
      letter-spacing: 0.06em;
    }

    /* tags */
    .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .tag {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface2);
    }
    .tag--energy { border-color: rgba(74,158,255,0.4); color: #4a9eff; background: rgba(74,158,255,0.07); }
    .tag--weapon { border-color: rgba(255,69,0,0.4);   color: var(--accent); background: rgba(255,69,0,0.07); }

    /* ── SECTION LABEL ── */
    .sec-label {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }
    .sec-label::before {
      content: '';
      display: block;
      width: 1.5rem;
      height: 1px;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── BLOCK ── */
    .block { margin-bottom: 3rem; }
    .block + .block { padding-top: 2.5rem; border-top: 1px solid var(--border); }

    /* ── BIO ── */
    .bio {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.85;
      max-width: 680px;
    }
    .bio strong { color: var(--text); }

    /* ── ARSENAL ── */
    .arsenal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .arsenal-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .arsenal-col-head {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .arsenal-col-head--offense { color: #ff5555; background: rgba(255,85,85,0.06); }
    .arsenal-col-head--defense { color: #4a9eff; background: rgba(74,158,255,0.06); }
    .arsenal-col-head--mobility { color: #44cc88; background: rgba(68,204,136,0.06); }
    .arsenal-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .arsenal-item:last-child { border-bottom: none; }
    .arsenal-item-name {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text);
      margin-bottom: 0.2rem;
    }
    .arsenal-item-note {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── FORMS ── */
    .forms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .form-card {
      border-radius: 6px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }
    .form-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .form-card--blue::before  { background: linear-gradient(90deg, #4a9eff, #9966ff); }
    .form-card--dark::before  { background: linear-gradient(90deg, #330000, #cc2200); }
    .form-card--corrupted::before { background: linear-gradient(90deg, #660033, #cc0066); }
    .form-card-title {
      font-family: var(--display);
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      margin-bottom: 0.6rem;
    }
    .form-card--blue .form-card-title     { color: #4a9eff; text-shadow: 0 0 20px rgba(74,158,255,0.5); }
    .form-card--dark .form-card-title     { color: #cc2200; text-shadow: 0 0 20px rgba(204,34,0,0.5); }
    .form-card--corrupted .form-card-title { color: #cc0066; text-shadow: 0 0 20px rgba(204,0,102,0.5); }
    .form-card-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.65;
    }
    .form-card-warning {
      margin-top: 0.75rem;
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: #cc0066;
      animation: blink 1.4s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── THREAT STATS ── */
    .stats-list { display: flex; flex-direction: column; gap: 0.85rem; }
    .stat-row { display: flex; align-items: center; gap: 1rem; }
    .stat-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      width: 160px;
      flex-shrink: 0;
    }
    .stat-bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 1s cubic-bezier(.22,.68,0,1.2);
    }
    .stat-value {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── EXPLOITS ── */
    .exploits-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .exploit-row {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.7rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.2s;
    }
    .exploit-row:hover { border-color: rgba(255,69,0,0.25); }
    .exploit-tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      flex-shrink: 0;
      width: 110px;
    }
    .exploit-note {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── CONTACT ── */
    .contact-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .contact-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 0.5rem 0.9rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .contact-chip:hover { border-color: rgba(255,69,0,0.3); color: var(--text); }
    .contact-chip svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }
    .contact-chip span { color: var(--text); }

    /* ── FOOTER ── */
    .sheet-footer {
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .sheet-footer-id {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: rgba(240,237,232,0.2);
      text-transform: uppercase;
    }
    .sheet-footer-back a {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .sheet-footer-back a:hover { color: var(--accent); }

    /* ── DIVIDER ACCENT ── */
    .accent-rule {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 2rem 0;
    }
    .accent-rule::before, .accent-rule::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .accent-rule-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: var(--glow-sm);
      flex-shrink: 0;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 720px) {
      .arsenal-grid { grid-template-columns: 1fr; }
      .forms-grid   { grid-template-columns: 1fr; }
      .stat-label   { width: 120px; font-size: 0.6rem; }
      .sheet-header { flex-direction: column; align-items: flex-start; }
      .header-right { text-align: left; }
      .version-block { align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .exploit-row { flex-direction: column; gap: 0.25rem; }
      .exploit-tag { width: auto; }
    }
    @media (max-width: 640px) {
      .sheet { padding: 1.5rem 1rem; }
      .sheet-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .trait-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stat-bar-fill { transition: none; }
      .form-card-warning { animation: none; }
    }

    /* ── IMAGE SLIDER ── */
    .slider-block { margin-bottom: 3rem; padding-top: 2.5rem; border-top: 1px solid var(--border); }
    .slider-wrap {
      position: relative;
      overflow: hidden;
    }
    .slider-track {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .slider-track::-webkit-scrollbar { display: none; }
    .slider-img {
      flex-shrink: 0;
      height: 340px;
      width: auto;
      max-width: 80vw;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      scroll-snap-align: start;
      transition: border-color 0.2s, transform 0.3s;
      display: block;
    }
    .slider-img:hover { border-color: rgba(255,69,0,0.35); transform: scale(1.01); }
    /* single image — fill width */
    .slider-track.solo .slider-img {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 520px;
    }
    /* arrow buttons */
    .slider-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(13,13,15,0.75);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 1rem;
      line-height: 1;
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      z-index: 2;
      display: flex; align-items: center; justify-content: center;
    }
    .slider-arrow:hover { background: rgba(255,69,0,0.18); border-color: rgba(255,69,0,0.4); }
    .slider-arrow--prev { left: 10px; }
    .slider-arrow--next { right: 10px; }
    .slider-arrow.hidden { opacity: 0; pointer-events: none; }
    /* dots */
    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 0.75rem;
    }
    .slider-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
    }
    .slider-dot.active { background: var(--accent); transform: scale(1.3); }
    @media (max-width: 600px) {
      .slider-img { height: 220px; }
      .slider-track.solo .slider-img { max-height: 300px; }
    }
  </style>
</head>
<body>

<div class="sheet">

  <!-- HEADER -->
  <header class="sheet-header">
    <div class="header-left">
      <div class="header-eyebrow">Character Sheet</div>
      <div class="sheet-name" id="ci-name"></div>
      <div class="sheet-alias" id="ci-alias"></div>
      <div class="tags" id="ci-tags"></div>
    </div>
    <div class="header-right">
      <div class="version-block" id="ci-versions"></div>
    </div>
  </header>

  <!-- BIO -->
  <div class="block">
    <div class="sec-label">About</div>
    <p class="bio" id="ci-bio"></p>
  </div>

  <!-- ARSENAL -->
  <div class="block">
    <div class="sec-label">Arsenal</div>
    <div class="arsenal-grid" id="ci-arsenal"></div>
  </div>

  <!-- FORMS -->
  <div class="block">
    <div class="sec-label">Forms</div>
    <div class="forms-grid" id="ci-forms"></div>
  </div>

  <!-- IMAGE SLIDER -->
  <div class="slider-block" id="ci-slider-block" style="display:none">
    <div class="sec-label">Gallery</div>
    <div class="slider-wrap" id="ci-slider-wrap">
      <button class="slider-arrow slider-arrow--prev hidden" id="slider-prev" aria-label="Previous">&#8592;</button>
      <div class="slider-track" id="slider-track"></div>
      <button class="slider-arrow slider-arrow--next hidden" id="slider-next" aria-label="Next">&#8594;</button>
    </div>
    <div class="slider-dots" id="slider-dots"></div>
  </div>

  <!-- THREAT PROFILE -->
  <div class="block">
    <div class="sec-label">Threat Profile</div>
    <div class="stats-list" id="ci-stats"></div>
    <div class="accent-rule"><div class="accent-rule-dot"></div></div>
    <div class="exploits-list" id="ci-exploits"></div>
  </div>

  <!-- CONTACT -->
  <div class="block">
    <div class="sec-label">Contact</div>
    <div class="contact-row" id="ci-contact"></div>
  </div>

  <!-- FOOTER -->
  <footer class="sheet-footer">
    <div class="sheet-footer-id" id="ci-footer-id"></div>
    <div class="sheet-footer-back"><a href="#" onclick="window.close();return false;">← Back to Character</a></div>
  </footer>

</div>

<script src="content.js"></script>
<script>
(function () {
  let C = PORTFOLIO_CONTENT;
  try { const s = localStorage.getItem('flame488_content'); if (s) C = JSON.parse(s); } catch(e){}
  const CI = C.characterInfo;
  const el  = id => document.getElementById(id);

  document.title = CI.name + ' — Character Sheet';

  // ── Identity
  el('ci-name').textContent  = CI.name;
  el('ci-alias').textContent = CI.alias;

  const styleMap = { energy: 'tag--energy', weapon: 'tag--weapon' };
  el('ci-tags').innerHTML = CI.tags.map(t =>
    `<span class="tag ${styleMap[t.style] || ''}">${t.label}</span>`
  ).join('');

  el('ci-versions').innerHTML = `
    <div class="ver-row">
      <span class="ver-label">Private</span>
      <span class="ver-num">${CI.privateVersion}</span>
    </div>
    <div class="ver-row">
      <span class="ver-label">Latest</span>
      <span class="ver-num ver-num--gold">${CI.latestVersion}</span>
      ${CI.versionNote ? `<span class="ver-note">${CI.versionNote}</span>` : ''}
    </div>`;

  el('ci-bio').textContent = CI.bio;

  // ── Arsenal
  const typeConf = {
    offense:  { label: '⚔ Offense',  cls: 'offense'  },
    defense:  { label: '🛡 Defense',  cls: 'defense'  },
    mobility: { label: '⚡ Mobility', cls: 'mobility' },
  };
  el('ci-arsenal').innerHTML = Object.entries(CI.arsenal).map(([k, items]) => {
    const { label, cls } = typeConf[k] || { label: k, cls: '' };
    return `<div class="arsenal-col">
      <div class="arsenal-col-head arsenal-col-head--${cls}">${label}</div>
      ${items.map(i => `<div class="arsenal-item">
        <div class="arsenal-item-name">${i.name}</div>
        <div class="arsenal-item-note">${i.note}</div>
      </div>`).join('')}
    </div>`;
  }).join('');

  // ── Forms
  el('ci-forms').innerHTML = CI.forms.map(f => `
    <div class="form-card form-card--${f.id}">
      <div class="form-card-title">${f.title}</div>
      <div class="form-card-desc">${f.desc}</div>
      ${f.warning ? `<div class="form-card-warning">${f.warning}</div>` : ''}
    </div>`).join('');

  // ── Stats (animate bars after paint)
  el('ci-stats').innerHTML = CI.stats.map((s, i) =>
    `<div class="stat-row">
      <div class="stat-label">${s.label}</div>
      <div class="stat-bar-wrap">
        <div class="stat-bar-fill" id="bar-${i}" style="width:0%;background:${s.gradient}"></div>
      </div>
      <div class="stat-value">${s.value}</div>
    </div>`
  ).join('');

  // ── Exploits
  el('ci-exploits').innerHTML = `<div style="font-family:var(--mono);font-size:0.58rem;letter-spacing:.14em;color:rgba(240,237,232,.25);text-transform:uppercase;margin-bottom:.6rem;">Known Exploits</div>` +
    CI.exploits.map(e =>
      `<div class="exploit-row">
        <div class="exploit-tag">${e.tag}</div>
        <div class="exploit-note">${e.note}</div>
      </div>`
    ).join('');

  // ── Contact
  const { discord, instagram } = C.commissions.contact;
  el('ci-contact').innerHTML = `
    <a class="contact-chip" href="https://discord.com/users/${discord}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.2 3a.1.1 0 0 0-.1 0 13.5 13.5 0 0 0-.6 1.3 18.1 18.1 0 0 0-5.1 0A13 13 0 0 0 8.8 3a.1.1 0 0 0-.1 0 19.5 19.5 0 0 0-5.1 1.4A20.8 20.8 0 0 0 .1 18a19.9 19.9 0 0 0 6 3 .1.1 0 0 0 .1-.1 14 14 0 0 0 1.2-2 .1.1 0 0 0-.1-.1 13 13 0 0 1-1.9-.9.1.1 0 0 1 0-.1l.4-.3a.1.1 0 0 1 .1 0 14.2 14.2 0 0 0 12.1 0 .1.1 0 0 1 .1 0l.4.3a.1.1 0 0 1 0 .1 12.8 12.8 0 0 1-1.9.9.1.1 0 0 0-.1.1 15.6 15.6 0 0 0 1.2 2 .1.1 0 0 0 .1.1 19.8 19.8 0 0 0 6-3A20.7 20.7 0 0 0 20.3 4.4zM8 15.4c-1.1 0-2-.9-2-2.1s.9-2 2-2c1.2 0 2.1 1 2 2.1 0 1.2-.9 2.1-2 2.1zm7.4 0c-1.1 0-2-.9-2-2.1s.9-2 2-2c1.2 0 2.1 1 2 2.1 0 1.2-.8 2.1-2 2.1z"/></svg>
      Discord: <span>${discord}</span>
    </a>
    <a class="contact-chip" href="https://instagram.com/${instagram}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.2 4.8 1.7 5 5 .1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.2 3.3-1.7 4.8-5 5-1.3.1-1.6.1-4.9.1s-3.6 0-4.8-.1c-3.3-.2-4.8-1.7-5-5C2 16.6 2 16.3 2 12s0-3.6.1-4.8C2.3 3.9 3.8 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zm0-2.2C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9C.3 21.3 2.7 23.7 7.1 23.9c1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9C23.7 2.7 21.3.3 16.9.1 15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 12 5.8zm0 10.2a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z"/></svg>
      Instagram: <span>@${instagram}</span>
    </a>`;

  // ── Footer watermark
  el('ci-footer-id').textContent = `${CI.name} · ${CI.latestVersion} · ${CI.alias}`;


  // ── IMAGE SLIDER ─────────────────────────────────────────
  const images = (CI.images || []).filter(Boolean);
  if (images.length > 0) {
    const block   = document.getElementById('ci-slider-block');
    const track   = document.getElementById('slider-track');
    const dots    = document.getElementById('slider-dots');
    const btnPrev = document.getElementById('slider-prev');
    const btnNext = document.getElementById('slider-next');

    block.style.display = '';
    if (images.length === 1) track.classList.add('solo');

    images.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src; img.className = 'slider-img';
      img.alt = `Character image ${i + 1}`; img.loading = 'lazy';
      track.appendChild(img);
    });

    if (images.length > 1) {
      images.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'slider-dot' + (i === 0 ? ' active' : '');
        d.addEventListener('click', () => scrollTo(i));
        dots.appendChild(d);
      });
      btnPrev.classList.remove('hidden');
      btnNext.classList.remove('hidden');
    }

    function scrollTo(idx) {
      const imgs = track.querySelectorAll('.slider-img');
      if (imgs[idx]) imgs[idx].scrollIntoView({ behavior:'smooth', block:'nearest', inline:'start' });
    }
    function updateDots() {
      const imgs = track.querySelectorAll('.slider-img');
      let closest = 0, minDist = Infinity;
      imgs.forEach((img, i) => {
        const dist = Math.abs(img.getBoundingClientRect().left - track.getBoundingClientRect().left);
        if (dist < minDist) { minDist = dist; closest = i; }
      });
      dots.querySelectorAll('.slider-dot').forEach((d, i) => d.classList.toggle('active', i === closest));
      btnPrev.classList.toggle('hidden', closest === 0);
      btnNext.classList.toggle('hidden', closest === imgs.length - 1);
      return closest;
    }
    track.addEventListener('scroll', updateDots, { passive: true });
    btnPrev.addEventListener('click', () => { const c = updateDots(); if (c > 0) scrollTo(c - 1); });
    btnNext.addEventListener('click', () => { const c = updateDots(); if (c < images.length - 1) scrollTo(c + 1); });
  }

  // ── Animate stat bars after layout
  requestAnimationFrame(() => {
    setTimeout(() => {
      CI.stats.forEach((s, i) => {
        const bar = document.getElementById(`bar-${i}`);
        if (bar) bar.style.width = s.value + '%';
      });
    }, 120);
  });

})();
</script>

<!-- Flame cursor (same engine as rest of site) -->
<script>
(function () {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9998;';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth, H = canvas.height = window.innerHeight;
  const particles = [], embers = [], shockwaves = [], trail = [];
  const mouse = { x: W/2, y: H/2, prevX: W/2, prevY: H/2, speed: 0 };
  const C1='#FF0055',C2='#FF6D00',C3='#FFD600',C4='#FFFFFF';
  function speedT(s){return Math.min(s/20,1);}
  function flameShape(ctx,w,h){ctx.beginPath();ctx.moveTo(0,-h);ctx.bezierCurveTo(w*.8,-h*.3,w,h*.5,0,h);ctx.bezierCurveTo(-w,h*.5,-w*.8,-h*.3,0,-h);ctx.closePath();ctx.fill();}
  class Flame{constructor(x,y,spd,idle,burst){this.reset(x,y,spd,idle,burst);}reset(x,y,spd,idle,burst){this.idle=idle;this.burst=burst;const t=speedT(spd);if(idle){this.x=x+(Math.random()-.5)*8;this.y=y+Math.random()*4;this.vx=(Math.random()-.5)*.4;this.vy=-(Math.random()*.8+.6);this.w=Math.random()*5+3;this.h=this.w*(Math.random()*.6+1.2);this.sr=.93;}else if(burst){this.x=x;this.y=y;const a=Math.random()*Math.PI*2,f=Math.random()*12+6;this.vx=Math.cos(a)*f;this.vy=Math.sin(a)*f;this.w=Math.random()*10+8;this.h=this.w*(Math.random()*.8+1.4);this.sr=Math.random()*.04+.93;}else{this.x=x+(Math.random()-.5)*6;this.y=y+(Math.random()-.5)*6;const sp=.3+t*.7,up=1+t*1.5;this.vx=(Math.random()-.5)*sp*2;this.vy=-up;this.w=Math.random()*(6+t*8)+4;this.h=this.w*(Math.random()*.8+1.4);this.sr=.92;}this.iw=this.w;this.angle=Math.atan2(this.vy,this.vx)+Math.PI/2+(Math.random()-.5)*.3;this.rs=(Math.random()-.5)*.12;}update(){this.x+=this.vx;this.y+=this.vy;if(this.idle)this.vx+=(Math.random()-.5)*.05;else if(this.burst){this.vx*=.94;this.vy*=.94;}this.w*=this.sr;this.h*=this.sr;this.angle+=this.rs;}draw(){if(this.w<.2)return;const p=1-this.w/this.iw;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.fillStyle=p>.4?C1:C2;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;flameShape(ctx,this.w,this.h);if(p<.75&&this.w>2){ctx.fillStyle=C3;ctx.shadowColor=C3;ctx.shadowBlur=6;flameShape(ctx,this.w*.6,this.h*.65);}if(p<.35&&this.w>3){ctx.fillStyle=C4;ctx.shadowColor=C4;ctx.shadowBlur=4;flameShape(ctx,this.w*.3,this.h*.35);}ctx.restore();}get dead(){return this.w<.2;}}
  class Ember{constructor(x,y,spd,idle,burst){this.x=x;this.y=y;const t=speedT(spd);if(idle){this.vx=(Math.random()-.5)*1.2;this.vy=-(Math.random()*1.5+1);this.size=Math.random()*2+2;this.sr=.94;}else if(burst){const a=Math.random()*Math.PI*2,f=Math.random()*14+8;this.vx=Math.cos(a)*f;this.vy=Math.sin(a)*f;this.size=Math.random()*6+4;this.sr=Math.random()*.03+.92;}else{const a=Math.random()*Math.PI*2,f=Math.random()*(4+t*6)+2;this.vx=Math.cos(a)*f;this.vy=Math.sin(a)*f-1;this.size=Math.random()*(4+t*3)+3;this.sr=.93;}const cols=[C3,C2,C1,C4];this.color=cols[Math.floor(Math.random()*cols.length)];this.rot=Math.random()*Math.PI*2;this.rs=(Math.random()-.5)*.4;}update(){this.x+=this.vx;this.y+=this.vy;this.vx*=.94;this.vy*=.94;this.size*=this.sr;this.rot+=this.rs;}draw(){if(this.size<.2)return;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(0,-this.size*1.2);ctx.lineTo(this.size*.6,this.size*.8);ctx.lineTo(-this.size*.8,this.size*.4);ctx.closePath();ctx.fill();ctx.restore();}get dead(){return this.size<.2;}}
  class Wave{constructor(x,y){this.x=x;this.y=y;this.r=6;this.life=1;this.rot=Math.random()*Math.PI*2;}update(){this.r+=(80-this.r)*.22;this.life-=.07;}draw(){if(this.life<=0)return;ctx.save();ctx.lineWidth=Math.max(2,6*this.life);ctx.strokeStyle=C3;ctx.shadowColor=C3;ctx.shadowBlur=12;ctx.beginPath();for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2+this.rot,px=this.x+Math.cos(a)*this.r,py=this.y+Math.sin(a)*this.r;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.closePath();ctx.stroke();ctx.restore();}get dead(){return this.life<=0;}}
  function move(x,y){mouse.prevX=mouse.x;mouse.prevY=mouse.y;mouse.x=x;mouse.y=y;const dx=x-mouse.prevX,dy=y-mouse.prevY;mouse.speed=Math.sqrt(dx*dx+dy*dy);trail.push({x,y});if(trail.length>8)trail.shift();const fc=Math.min(Math.floor(mouse.speed*.25)+1,4);for(let i=0;i<fc;i++)particles.push(new Flame(x,y,mouse.speed));if(mouse.speed>5){const ec=Math.min(Math.floor(mouse.speed*.2),3);for(let i=0;i<ec;i++)embers.push(new Ember(x,y,mouse.speed));}}
  window.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  window.addEventListener('touchmove',e=>{if(e.touches.length)move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  window.addEventListener('click',e=>{shockwaves.push(new Wave(e.clientX,e.clientY));for(let i=0;i<14;i++)particles.push(new Flame(e.clientX,e.clientY,0,false,true));for(let i=0;i<16;i++)embers.push(new Ember(e.clientX,e.clientY,0,false,true));});
  window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;});
  function loop(){ctx.clearRect(0,0,W,H);if(mouse.speed<1){if(trail.length>0)trail.shift();if(Math.random()<.4)particles.push(new Flame(mouse.x,mouse.y,0,true));if(Math.random()<.15)embers.push(new Ember(mouse.x,mouse.y,0,true));}mouse.speed*=.88;if(trail.length>=3){const passes=[{c:C2,w:1,g:10},{c:C3,w:.5,g:6},{c:C4,w:.2,g:3}];passes.forEach(p=>{ctx.save();ctx.strokeStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=p.g;ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<trail.length-1;i++){const xc=(trail[i].x+trail[i+1].x)/2,yc=(trail[i].y+trail[i+1].y)/2,fr=i/trail.length;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.quadraticCurveTo(trail[i].x,trail[i].y,xc,yc);ctx.lineWidth=fr*14*p.w;ctx.stroke();}ctx.restore();});}for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw();if(particles[i].dead)particles.splice(i,1);}for(let i=embers.length-1;i>=0;i--){embers[i].update();embers[i].draw();if(embers[i].dead)embers.splice(i,1);}for(let i=shockwaves.length-1;i>=0;i--){shockwaves[i].update();shockwaves[i].draw();if(shockwaves[i].dead)shockwaves.splice(i,1);}ctx.save();ctx.shadowColor=C2;ctx.shadowBlur=12;ctx.fillStyle=C2;ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle=C3;ctx.beginPath();ctx.arc(mouse.x,mouse.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle=C4;ctx.beginPath();ctx.arc(mouse.x,mouse.y,3,0,Math.PI*2);ctx.fill();ctx.restore();requestAnimationFrame(loop);}
  loop();
})();
</script>
