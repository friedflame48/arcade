<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - Arcade</title>
    <link rel="stylesheet" href="style_velha.css">
</head>
<body>
    <a href="../index.html" class="btn-retornar">Retornar</a>
    <div class="container">
        <h1>Jogo da Velha</h1>
        
        <p id="status" class="status">Vez do jogador 'X'</p>

        <div class="tabuleiro" id="tabuleiro">
            <button class="celula" data-index="0"></button>
            <button class="celula" data-index="1"></button>
            <button class="celula" data-index="2"></button>
            <button class="celula" data-index="3"></button>
            <button class="celula" data-index="4"></button>
            <button class="celula" data-index="5"></button>
            <button class="celula" data-index="6"></button>
            <button class="celula" data-index="7"></button>
            <button class="celula" data-index="8"></button>
        </div>

        <button id="btn-reiniciar" class="btn-reiniciar">Reiniciar Jogo</button>
    </div>

    <script src="jogo_da_velha.js"></script>
</body>
</html>
